name: Generic Frontend (React/Vite) IIS CI/CD Pipeline

on:
  push:
    branches:
      - react-app
      - main
  workflow_dispatch: # امکان اجرای دستی با یک کلیک از تب Actions گیت‌هاب

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: "Hozur Frontend"
  DEPLOY_PATH: 'C:\vc2' # مسیر پوشه ریشه فرانت‌اند در IIS سرور
  TEMP_PUBLISH_PATH: 'C:\temp_publish\hozur_frontend' # مسیر موقت استیجینگ فایل‌های بیلد
  TELEGRAM_CHAT_ID: "-1003492895671"

jobs:
  # =============================================================
  # جاب ۱: نصب وابستگی‌ها و بیلد فرانت‌اند (Build)
  # =============================================================
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Code (Fast Shallow Clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies (Fast with Cache)
        run: |
          Write-Host "Installing npm dependencies (prefer-offline)..."
          npm install --prefer-offline --no-audit --no-fund

      - name: Build Vite Project
        run: |
          Write-Host "Building React project with Vite..."
          npm run build
          # ایجاد فایل index.htm برای سازگاری کامل با IIS
          Copy-Item -Path "dist\index.html" -Destination "dist\index.htm" -Force
          
          # استیجینگ فایل‌های بیلد در مسیر موقت جهت انتقال به جاب Deploy
          if (Test-Path "$env:TEMP_PUBLISH_PATH") {
              Remove-Item "$env:TEMP_PUBLISH_PATH" -Recurse -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Path "$env:TEMP_PUBLISH_PATH" -Force | Out-Null
          Copy-Item -Path "dist\*" -Destination "$env:TEMP_PUBLISH_PATH" -Recurse -Force
          Write-Host "Vite build completed and staged to $env:TEMP_PUBLISH_PATH."

  # =============================================================
  # جاب ۲: بکاپ و استقرار روی سرور IIS (Deploy & Health Check)
  # =============================================================
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Fast Pre-Deploy Backup
        run: |
          $backupRoot = "C:\backups\hozur_frontend"
          if (!(Test-Path $backupRoot)) {
              New-Item -ItemType Directory -Path $backupRoot -Force | Out-Null
          }
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $backupDir = Join-Path $backupRoot "backup_$timestamp"
          
          if (Test-Path $env:DEPLOY_PATH) {
              Write-Host "Creating fast pre-deploy backup at $backupDir..."
              robocopy "$env:DEPLOY_PATH" "$backupDir" /E /XD "logs" "temp" "node_modules" /R:1 /W:1 /NDL /NFL /NJH /NJS | Out-Null
              if ($LASTEXITCODE -lt 8) {
                  $LASTEXITCODE = 0
              } else {
                  throw "Robocopy failed with error code $LASTEXITCODE"
              }
              Write-Host "Backup created successfully."
              
              # نگهداری فقط ۵ بکاپ آخر جهت صرفه‌جویی در دیسک
              $oldBackups = Get-ChildItem -Path $backupRoot -Directory | Sort-Object CreationTime -Descending | Select-Object -Skip 5
              foreach ($old in $oldBackups) {
                  Write-Host "Removing old backup: $($old.FullName)"
                  Remove-Item -Path $old.FullName -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

      - name: Deploy to IIS (Robust File Sync)
        run: |
          $currentUser = whoami
          Write-Host "Running frontend deployment as user: $currentUser"
          if (!(Test-Path "$env:TEMP_PUBLISH_PATH") -or @(Get-ChildItem "$env:TEMP_PUBLISH_PATH" -Recurse -File).Count -eq 0) {
              throw "Staging directory $env:TEMP_PUBLISH_PATH is missing or empty! Ensure build and deploy runners share the same server."
          }

          if (!(Test-Path "$env:DEPLOY_PATH")) {
              New-Item -ItemType Directory -Path "$env:DEPLOY_PATH" -Force | Out-Null
          }
          
          # رفع صفت فقط‌خواندنی (Read-Only) احتمالی روی فایل‌های موجود
          Get-ChildItem -Path "$env:DEPLOY_PATH" -Recurse -Force -ErrorAction SilentlyContinue | Where-Object { $_.IsReadOnly } | ForEach-Object {
              try { $_.IsReadOnly = $false } catch { }
          }
          
          Write-Host "Deploying build files from $env:TEMP_PUBLISH_PATH to $env:DEPLOY_PATH..."
          
          $copiedCount = 0
          $skippedAssetCount = 0
          $skipAllowedExtensions = @('.png', '.jpg', '.jpeg', '.webp', '.svg', '.gif', '.woff', '.woff2', '.ttf', '.eot', '.mp4')
          
          $sourceFiles = Get-ChildItem -Path "$env:TEMP_PUBLISH_PATH" -Recurse -File
          $sourceRootLength = $env:TEMP_PUBLISH_PATH.TrimEnd('\', '/').Length
          
          foreach ($file in $sourceFiles) {
              $relPath = $file.FullName.Substring($sourceRootLength).TrimStart('\', '/')
              $destPath = Join-Path $env:DEPLOY_PATH $relPath
              $destDir = Split-Path -Parent $destPath
              
              if (!(Test-Path $destDir)) {
                  New-Item -ItemType Directory -Path $destDir -Force | Out-Null
              }
              
              $copied = $false
              $lastErr = $null
              for ($attempt = 1; $attempt -le 2; $attempt++) {
                  try {
                      Copy-Item -Path $file.FullName -Destination $destPath -Force -ErrorAction Stop
                      $copied = $true
                      $copiedCount++
                      break
                  } catch {
                      $lastErr = $_
                      Start-Sleep -Seconds 1
                  }
              }
              
              if (-not $copied) {
                  $ext = $file.Extension.ToLowerInvariant()
                  if (($relPath -like "assets*") -and ($skipAllowedExtensions -contains $ext) -and (Test-Path $destPath)) {
                      Write-Warning "Hashed static asset in use, kept existing: $relPath"
                      $skippedAssetCount++
                  } else {
                      throw "Access/Lock error copying '$relPath' to '$destPath' as '$currentUser': $($lastErr.Exception.Message). Run runner as Local System or grant Full Control on '$env:DEPLOY_PATH' to '$currentUser'."
                  }
              }
          }
          
          $idxInfo = Get-Item (Join-Path $env:DEPLOY_PATH "index.html") -ErrorAction SilentlyContinue
          Write-Host "Frontend sync complete: $copiedCount copied, $skippedAssetCount static assets kept. index.html LastWriteTime: $($idxInfo.LastWriteTime)"

      - name: Post-Deploy Health Check
        run: |
          Start-Sleep -Seconds 3
          try {
              [System.Net.ServicePointManager]::ServerCertificateValidationCallback = {$true}
              $healthUrl = "https://vc2.hekmateislami.com"
              Write-Host "Pinging frontend URL: $healthUrl"
              $res = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 15 -ErrorAction Stop
              Write-Host "Health Check SUCCESS: HTTP Status $($res.StatusCode)"
          } catch {
              Write-Warning "Health check warning: $($_.Exception.Message)"
          }

      - name: Cleanup Temp Publish
        if: always()
        run: |
          if (Test-Path "$env:TEMP_PUBLISH_PATH") {
              Remove-Item "$env:TEMP_PUBLISH_PATH" -Recurse -Force -ErrorAction SilentlyContinue
          }

  # =============================================================
  # جاب ۳: ارسال گزارش تلگرام (کلود گیتهاب با متد GET)
  # =============================================================
  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Rich Telegram Notification via GitHub Cloud (GET)
        run: |
          B_RES="${{ needs.build.result }}"
          D_RES="${{ needs.deploy.result }}"
          
          [ "$B_RES" = "success" ] && B_ICON="✅" || B_ICON="❌"
          [ "$D_RES" = "success" ] && D_ICON="✅" || D_ICON="❌"
          
          if [ "$D_RES" = "success" ]; then
            TITLE="🚀 *Frontend Deployment Successful!*"
          else
            TITLE="⚠️ *Frontend Deployment Failed!*"
          fi
          
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.actor }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          TEXT="$TITLE%0A%0A📁 *Project:* ${{ env.PROJECT_NAME }}%0A🔨 *Build:* $B_ICON $B_RES%0A📦 *Deploy:* $D_ICON $D_RES%0A%0A📝 *Commit:* $COMMIT_MSG%0A👤 *Author:* $AUTHOR%0A🔗 [View Run]($RUN_URL)"
          
          curl -s -G "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$TEXT" \
            --data-urlencode "parse_mode=Markdown" \
            --connect-timeout 10 --max-time 20 || echo "Telegram notification skipped or failed (Exit code: $?)."
