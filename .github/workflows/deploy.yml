name: Generic .NET IIS CI/CD Pipeline

on:
  push:
    branches:
      - CoreMe2
      - main
  workflow_dispatch: # امکان اجرای دستی با یک کلیک از تب Actions گیت‌هاب

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: "Hozur Backend"
  MAIN_PROJECT: "CoreMe/CoreMe.csproj"
  TEST_PROJECT: "CoreMe.Tests/CoreMe.Tests.csproj"
  DEPLOY_PATH: 'C:\hekmat'
  TEMP_PUBLISH_PATH: 'C:\temp_publish\hozur_backend'
  TELEGRAM_CHAT_ID: "-1003492895671"

jobs:
  # =============================================================
  # جاب ۱: تست‌های واحد (TDD Guard)
  # =============================================================
  tests:
    runs-on: self-hosted
    steps:
      - name: Checkout Code (Fast Shallow Clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # فقط آخرین کامیت را دانلود می‌کند نه ۱ گیگابایت تاریخچه گیت را

      - name: Run Unit Tests
        run: |
          Write-Host "Running Unit Tests..."
          dotnet test "$env:TEST_PROJECT" -c Release

  # =============================================================
  # جاب ۲: کامپایل و بیلد پروژه (Build & Publish)
  # =============================================================
  build:
    needs: tests
    runs-on: self-hosted
    steps:
      - name: Checkout Code (Fast Shallow Clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean & Publish Backend
        run: |
          if (Test-Path "$env:TEMP_PUBLISH_PATH") {
              Remove-Item "$env:TEMP_PUBLISH_PATH" -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Publishing $env:PROJECT_NAME in Release mode..."
          dotnet publish "$env:MAIN_PROJECT" -c Release -o "$env:TEMP_PUBLISH_PATH"
          
          # حذف پوشه‌های زبان اضافی ماهواره‌ای (جهت جلوگیری از قفل فایل در IIS)
          Get-ChildItem -Path "$env:TEMP_PUBLISH_PATH" -Directory -ErrorAction SilentlyContinue | Where-Object {
              $_.Name -match '^(cs|de|es|fr|it|ja|ko|pl|pt-BR|ru|tr|zh-Hans|zh-Hant)$'
          } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          
          # تایید و چاپ مشخصات فایل کامپایل‌شده اصلی
          $pubDll = Join-Path $env:TEMP_PUBLISH_PATH "CoreMe.dll"
          if (Test-Path $pubDll) {
              $pubDllInfo = Get-Item $pubDll
              Write-Host "BUILD SUCCESS: CoreMe.dll created at $($pubDllInfo.LastWriteTime) (Size: $($pubDllInfo.Length) bytes)"
          }
          Write-Host "Build & Publish completed successfully."

  # =============================================================
  # جاب ۳: استقرار در IIS، بکاپ و بررسی سلامت (Deploy & Health Check)
  # =============================================================
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Fast Pre-Deploy Backup
        run: |
          $backupRoot = "C:\backups\hozur_backend"
          if (!(Test-Path $backupRoot)) {
              New-Item -ItemType Directory -Path $backupRoot -Force | Out-Null
          }
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $backupDir = Join-Path $backupRoot "backup_$timestamp"
          
          if (Test-Path $env:DEPLOY_PATH) {
              Write-Host "Creating fast pre-deploy backup at $backupDir..."
              # استفاده از robocopy با استثنا کردن پوشه‌های حجیم لاگ و آپلود برای کاهش زمان به ۱ ثانیه
              robocopy "$env:DEPLOY_PATH" "$backupDir" /E /XD "logs" "temp" "uploads" "App_Data" /R:1 /W:1 /NDL /NFL /NJH /NJS | Out-Null
              if ($LASTEXITCODE -lt 8) {
                  $LASTEXITCODE = 0
              } else {
                  throw "Robocopy failed with error code $LASTEXITCODE"
              }
              Write-Host "Backup created successfully."
              
              # نگهداری فقط ۵ بکاپ آخر جهت بهینه‌سازی فضای دیسک
              $oldBackups = Get-ChildItem -Path $backupRoot -Directory | Sort-Object CreationTime -Descending | Select-Object -Skip 5
              foreach ($old in $oldBackups) {
                  Write-Host "Removing old backup: $($old.FullName)"
                  Remove-Item -Path $old.FullName -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

      - name: Deploy to IIS (Safe Lock Handling & Robocopy)
        run: |
          $offlineFile = Join-Path $env:DEPLOY_PATH "app_offline.htm"
          Set-Content -Path $offlineFile -Value "<html><head><meta charset='utf-8'></head><body><h2>Updating $env:PROJECT_NAME...</h2><p>Please wait a moment.</p></body></html>" -Encoding UTF8
          
          Write-Host "Placed app_offline.htm. Waiting 5 seconds for IIS to release file handles..."
          Start-Sleep -Seconds 5
          
          # رفع صفت فقط‌خواندنی (Read-Only) احتمالی روی فایل‌های موجود
          Get-ChildItem -Path "$env:DEPLOY_PATH" -Recurse -Force -ErrorAction SilentlyContinue | Where-Object { $_.IsReadOnly } | ForEach-Object {
              $_.IsReadOnly = $false
          }
          
          # بستن پروسه‌های معلق احتمالی دات‌نت مرتبط با این مسیر
          Get-CimInstance Win32_Process -Filter "Name = 'dotnet.exe'" -ErrorAction SilentlyContinue | Where-Object {
              $_.CommandLine -like "*$env:DEPLOY_PATH*"
          } | ForEach-Object {
              Write-Host "Stopping lingering dotnet process (PID: $($_.ProcessId))..."
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
          
          # بازنشانی تمامی استخرهای برنامه IIS جهت آزادسازی هندل‌ها و لود کد جدید
          $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
          if (Test-Path $appcmd) {
              try {
                  $apppools = & $appcmd list apppool /text:name
                  foreach ($ap in $apppools) {
                      Write-Host "Recycling IIS AppPool: $ap"
                      & $appcmd recycle apppool /apppool.name:"$ap" -ErrorAction SilentlyContinue | Out-Null
                  }
              } catch { }
          }
          
          Write-Host "Deploying files from $env:TEMP_PUBLISH_PATH to $env:DEPLOY_PATH using Robocopy..."
          # انتقال هوشمند همراه با گزارش خلاصه فایل‌های کپی‌شده
          robocopy "$env:TEMP_PUBLISH_PATH" "$env:DEPLOY_PATH" /E /XF "app_offline.htm" /R:5 /W:2 /NP
          if ($LASTEXITCODE -lt 8) {
              $LASTEXITCODE = 0
          } else {
              throw "Robocopy deployment failed with error code $LASTEXITCODE"
          }
          
          # حذف فایل آفلاین جهت راه‌اندازی مجدد برنامه در IIS
          if (Test-Path $offlineFile) {
              Remove-Item -Path $offlineFile -Force -ErrorAction SilentlyContinue
              Write-Host "Removed app_offline.htm. Application is back online."
          }
          
          # لمس web.config جهت تضمین صددرصدی لود مجدد DLLها توسط IIS
          $webConfig = Join-Path $env:DEPLOY_PATH "web.config"
          if (Test-Path $webConfig) {
              (Get-Item $webConfig).LastWriteTime = Get-Date
              Write-Host "Touched web.config to trigger immediate IIS application reload."
          }
          
          # تایید نهایی و گزارش زمان CoreMe.dll مستقر شده در سرور
          $deployedDll = Join-Path $env:DEPLOY_PATH "CoreMe.dll"
          if (Test-Path $deployedDll) {
              $dInfo = Get-Item $deployedDll
              Write-Host "DEPLOY VERIFIED -> Deployed CoreMe.dll LastWriteTime: $($dInfo.LastWriteTime) Size: $($dInfo.Length) bytes"
          }
          Write-Host "All files deployed successfully!"

      - name: Post-Deploy Warmup & Health Check
        run: |
          Write-Host "Waiting 5 seconds for IIS worker process warm-up..."
          Start-Sleep -Seconds 5
          try {
              [System.Net.ServicePointManager]::ServerCertificateValidationCallback = {$true}
              $healthUrl = "https://core.hekmateislami.com/user/check-client"
              Write-Host "Pinging health endpoint: $healthUrl"
              $res = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 15 -ErrorAction Stop
              Write-Host "Health Check SUCCESS: HTTP Status $($res.StatusCode)"
          } catch {
              Write-Warning "Health check warning: $($_.Exception.Message)"
          }

      - name: Cleanup Temp Publish
        if: always()
        run: |
          if (Test-Path "$env:TEMP_PUBLISH_PATH") {
              Remove-Item "$env:TEMP_PUBLISH_PATH" -Recurse -Force -ErrorAction SilentlyContinue
          }

  # =============================================================
  # جاب ۴: اطلاع‌رسانی به تلگرام (کلود گیتهاب با متد GET)
  # =============================================================
  notify:
    needs: [tests, build, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Rich Telegram Notification via GitHub Cloud (GET)
        run: |
          T_RES="${{ needs.tests.result }}"
          B_RES="${{ needs.build.result }}"
          D_RES="${{ needs.deploy.result }}"
          
          [ "$T_RES" = "success" ] && T_ICON="✅" || T_ICON="❌"
          [ "$B_RES" = "success" ] && B_ICON="✅" || B_ICON="❌"
          [ "$D_RES" = "success" ] && D_ICON="✅" || D_ICON="❌"
          
          if [ "$D_RES" = "success" ]; then
            TITLE="🚀 *Deployment Successful!*"
          else
            TITLE="⚠️ *Deployment Failed!*"
          fi
          
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.actor }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          TEXT="$TITLE%0A%0A📁 *Project:* ${{ env.PROJECT_NAME }}%0A🧪 *Tests:* $T_ICON $T_RES%0A🔨 *Build:* $B_ICON $B_RES%0A📦 *Deploy:* $D_ICON $D_RES%0A%0A📝 *Commit:* $COMMIT_MSG%0A👤 *Author:* $AUTHOR%0A🔗 [View Run]($RUN_URL)"
          
          curl -s -G "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$TEXT" \
            --data-urlencode "parse_mode=Markdown" \
            --connect-timeout 10 --max-time 20 || echo "Telegram notification skipped or failed (Exit code: $?)."
